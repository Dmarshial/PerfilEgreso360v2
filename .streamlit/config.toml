# Tema base de Streamlit. El CSS de src/theme.py afina el detalle, pero los
# widgets nativos (inputs, dataframes, menús) toman sus colores de aquí:
# sin esta sección seguirían dibujándose en modo oscuro.

[theme]
base = "light"
primaryColor = "#2c6647"
backgroundColor = "#f7f3ea"
secondaryBackgroundColor = "#ffffff"
textColor = "#101820"
font = "serif"

[client]
toolbarMode = "minimal"
